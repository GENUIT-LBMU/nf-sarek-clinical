# ──────────────────────────────────────────────────────────────────────────────
# nf-sarek-clinical fixed reference parameters — TEMPLATE
# ──────────────────────────────────────────────────────────────────────────────
# Copy this file to your working directory (or to lab_params.yml) and fill in
# the paths for your site. Used by run_full.sh / run_github.sh:
#   nextflow run main.nf -params-file full_pipeline.params.yml
#
# Dynamic parameters (set per run by run_full.sh):
#   --sarek_outdir, --run_name, --outdir
#
# See README.md → "Reference files" for download instructions.
# ──────────────────────────────────────────────────────────────────────────────

# ── nf-core/sarek site-specific paths (Phase 1) ───────────────────────────────
# These are passed to nf-core/sarek when run_full.sh executes Phase 1.
# Skip in lab_params.yml only if you always run with --skip-sarek.
intervals:        /path/to/refs/<kit>/<kit>_Regions.bed         # WES capture BED
ascat_alleles:    /path/to/refs/ascat/ascat_alleles.zip
ascat_loci:       /path/to/refs/ascat/ascat_loci.zip
ascat_loci_gc:    /path/to/refs/ascat/ascat_loci_gc.zip
ascat_loci_rt:    /path/to/refs/ascat/ascat_loci_rt.zip

# ── SNV annotation ────────────────────────────────────────────────────────────
snpsift_jar:    /path/to/refs/snpEff/SnpSift.jar

# ── Population frequencies (required for germline SNVs) ───────────────────────
# Local gnomAD v4.1 joint subset for the gene panels (scripts/build_gnomad_panel.sh).
# The *_regions.bed.gz next to it is found automatically.
gnomad_tsv:     /path/to/refs/gnomad/gnomad_v4.1_panel.tsv.gz

# ── MANE Select nomenclature (recommended) ────────────────────────────────────
# snpEff data dir containing GRCh38.mane.1.2.refseq/ (see README). Without it,
# germline HGVS uses sarek's snpEff -canon transcript (longest CDS).
snpeff_mane_data: /path/to/refs/snpeff/data

# ── ClinVar (required for germline SNVs) ──────────────────────────────────────
# Local ClinVar subset for the gene panels (scripts/build_clinvar_panel.sh).
clinvar_tsv:    /path/to/refs/clinvar/clinvar_20260822_panel.tsv.gz
# ClinVar P/LP missense in MANE protein coordinates, for ACMG PS1 / PM5
# (scripts/build_clinvar_protein_index.py). Rebuild with each ClinVar release.
clinvar_protein_index: /path/to/refs/clinvar/clinvar_20260822_protein_index.tsv.gz
# Frozen CIViC cache for somatic annotation (scripts/build_civic_cache.sh, run
# with the civicpy image). Required for somatic postprocessing; no network at run time.
civic_cache:    /path/to/refs/civic/civicpy_cache_20261024.pkl

# ── REVEL v1.3 (required for germline SNVs) ───────────────────────────────────
# Panel subset with the MANE Select score per allele (scripts/build_revel_panel.py).
revel_tsv:      /path/to/refs/revel/revel_v1.3_panel.tsv.gz

# ── SpliceAI (germline candidates) ────────────────────────────────────────────
spliceai:       true
# spliceai_fasta: /path/to/refs/hg38/hg38.fa     # defaults to gcnv_fasta

# ── TMB calculation (WES capture BED) ─────────────────────────────────────────
panel_bed:      /path/to/refs/hg38/<kit>/<kit>_Regions.bed

# ── Gene coordinates BED (for CNV gene overlap) ────────────────────────────────
gene_coords_bed: /path/to/refs/hg38/<kit>/<kit>_Padded.withGenes.bed

# ── Germline CNV (GATK gCNV) ──────────────────────────────────────────────────
gcnv_ploidy_model:  /path/to/refs/cnv/ploidy-model
gcnv_pon_dir:       /path/to/refs/cnv/PoN_CNV
gcnv_interval_list: /path/to/refs/cnv/exomas.interval_list
gcnv_fasta:         /path/to/refs/hg38/hg38.fa
gcnv_dict:          /path/to/refs/hg38/hg38.dict
gcnv_mane_txt:      /path/to/refs/mane/exons_mane_v1.2.txt   # scripts/build_mane_exons.py (MANE v1.2)
gcnv_lowmap_bed:    /path/to/refs/cnv/lowmap/GRCh38_lowmappabilityall_panel.bed.gz  # scripts/build_lowmap_panel.sh
# cram_fasta: /path/to/refs/Homo_sapiens_assembly38.fasta  # only if Sarek left CRAM and no BAM (the FASTA Sarek used; + .fai and .dict)
# exon_annotation.R is bundled in the pipeline (bin/) — no path needed

# ── Somatic CNV (GATK) ────────────────────────────────────────────────────────
somatic_pon_hdf5:        /path/to/refs/cnv/wes-do-gc.pon.hdf5
somatic_interval_list:   /path/to/refs/cnv/preprocessed.interval_list
common_snps_vcf:         /path/to/refs/cnv/common_snps_preprocessed.vcf.gz
somatic_fasta:           /path/to/refs/cnv/main_chroms/hg38.main_chroms.fa
somatic_dict:            /path/to/refs/cnv/main_chroms/hg38.main_chroms.dict
# annotate_cnvs_complete_fixed.R is bundled in the pipeline (bin/) — no path needed
